---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
- name: Daemon reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
- name: Restart PostgreSQL exporter
  ansible.builtin.systemd_service:
    name: postgres-exporter
    state: restarted
    daemon_reload: true
  become: true
# handlers file for roles/postgres
